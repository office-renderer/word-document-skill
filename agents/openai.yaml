interface:
  display_name: "Word 文档排版"
  short_description: "固定模板排版 → 校验 → 按报告自动修复"
  default_prompt: "Use $word-document-skill only for Word formatting. Run format_docx.py, then validate_docx.py with a report. If validation fails, feed the report back to format_docx.py for targeted repair, then revalidate. Stop after two repair cycles. Do not draft or rewrite substantive content."
